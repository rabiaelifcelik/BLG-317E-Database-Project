{% extends "layout.html" %}
{% block title %}Movies{% endblock %}
{% block page_css %}
<link rel="stylesheet" href="/static/titles.css"/>
{% endblock %}
{% block content %}
        <h1 class="title">Titles</h1>

        {% if titles %}
        <div class="scrollable-content">
        {% for title in titles %}
                <a href="{{ url_for('title_page', title_id=title.tconst) }}">
                        <b>{{ title.primaryTitle }}</b><br>
                </a>
        {% endfor %}
        </div>
        {% endif %}
{% endblock %}
