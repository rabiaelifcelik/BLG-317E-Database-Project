{% extends "layout.html" %}
{% block title %}Movies{% endblock %}
{% block content %}
        <h1 class="title">Titles</h1>

        {% if titles %}
        
        {% for title in titles %}
                <b>{{ title.primaryTitle }}</b>, {{title.startYear}}, {{title.genres}}<br/>
        {% endfor %}
    
        {% endif %}
{% endblock %}
