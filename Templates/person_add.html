{% extends "layout.html" %}

{% block title %}Add New Person{% endblock %}

{% block content %}
<div class="person-detail-container">
    <div class="back-nav">
        <a href="{{ url_for('people_page') }}" class="btn-back">← Back to People</a>
    </div>

    <div class="add-form-container">
        <h1>Add New Person</h1>
        
        <form method="POST" class="add-form">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Tom Hanks">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="birth_year">Birth Year</label>
                    <input type="number" id="birth_year" name="birth_year" min="1800" max="2025" placeholder="e.g., 1956">
                </div>

                <div class="form-group">
                    <label for="death_year">Death Year</label>
                    <input type="number" id="death_year" name="death_year" min="1800" max="2025" placeholder="Optional">
                </div>
            </div>

            <div class="form-group">
                <label for="profession">Primary Profession</label>
                <input type="text" id="profession" name="profession" placeholder="e.g., actor,director,producer">
                <small>Separate multiple professions with commas</small>
            </div>

            <div class="form-group">
                <label for="most_known_title">Most Known Title (ID)</label>
                <input type="text" id="most_known_title" name="most_known_title" placeholder="e.g., tt0111161">
                <small>Enter a single title ID (optional)</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Add Person</button>
                <a href="{{ url_for('people_page') }}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.add-form-container {
    max-width: 700px;
    margin: 30px auto;
    background: rgba(129, 137, 255, 0.3);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.add-form-container h1 {
    color: #ddff44;
    margin-bottom: 30px;
    text-align: center;
}

.add-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    color: #ddd;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.95em;
}

.form-group input {
    padding: 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 1em;
}

.form-group input:focus {
    outline: none;
    border-color: #667eea;
    background: rgba(255, 255, 255, 0.15);
}

.form-group small {
    color: #aaa;
    font-size: 0.85em;
    margin-top: 5px;
}

.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.btn-submit {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s;
}

.btn-submit:hover {
    transform: translateY(-2px);
}

.btn-cancel {
    flex: 1;
    padding: 14px;
    background: #6c757d;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-size: 1.1em;
    transition: background 0.3s;
}

.btn-cancel:hover {
    background: #5a6268;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .add-form-container {
        padding: 20px;
    }
}
</style>
{% endblock %}
