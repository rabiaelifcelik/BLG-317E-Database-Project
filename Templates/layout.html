<!DOCTYPE html>
<!-- This kind of structure helps writing layouts and helps to customize each page from similar templates -->
<html>
    <head>
        <meta charset="utf-8"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/static/style.css"/>
        <title>{% block title %}{% endblock %} - Movie Surf</title>
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar-container">
                <a href="{{ url_for('home_page') }}" class="navbar-brand">
                    <i class="fas fa-film"></i>
                    <span>Movie Surf</span>
                </a>
                
                <div class="navbar-menu">
                    <a href="{{ url_for('home_page') }}" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <a href="{{ url_for('titles_page') }}" class="nav-link">
                        <i class="fas fa-video"></i>
                        <span>Titles</span>
                    </a>
                    <a href="{{ url_for('principals_page') }}" class="nav-link">
                        <i class="fas fa-star"></i>
                        <span>Principals</span>
                    </a>
                    <a href="{{ url_for('cast_page') }}" class="nav-link">
                        <i class="fas fa-users"></i>
                        <span>Cast</span>
                    </a>
                    <a href="{{ url_for('people_page') }}" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>People</span>
                    </a>

                    <a href="{{ url_for('akas_list_page') }}" class="nav-link">
                        <i class="fas fa-globe"></i>
                        <span>Akas</span>
                    </a>
                </div>
            </div>
        </nav>
        
        <div class="main-content">
            {% block content %}
            {% endblock %}
        </div>
        
        <footer>
            <div class="footer-content">
                <p><i class="fas fa-database"></i> BLG-317 Database Systems Project</p>
                <p>2025-2026 © Movie Surf</p>
            </div>
        </footer>
    </body>
</html>
